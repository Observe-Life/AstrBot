name: Custom Image Build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-custom-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Dashboard
        run: |
          dashboard_version=$(python3 - <<PY
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print("v" + tomllib.load(f)["project"]["version"])
          PY
          )
          cd dashboard
          npm install
          npm run build
          mkdir -p dist/assets
          echo "$dashboard_version" > dist/assets/version
          cd ..
          mkdir -p astrbot/dashboard
          rm -rf astrbot/dashboard/dist
          cp -r dashboard/dist astrbot/dashboard/dist

      - name: Generate Dockerfile.custom (upstream Dockerfile + baked TZ)
        run: |
          cp Dockerfile Dockerfile.custom
          printf "\nENV TZ=Asia/Shanghai\n" >> Dockerfile.custom
          tail -5 Dockerfile.custom

      - name: Set Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.custom
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/observe-life/astrbot:4.29.0-customize
            ghcr.io/observe-life/astrbot:customize-latest
