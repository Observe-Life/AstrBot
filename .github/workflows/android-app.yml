name: Android App (极简 WebView 壳)

# 独立流水线：只为安卓 APK 服务，不影响主构建。
# 产物发布到滚动 Release customize-build（astrbot-webui-debug.apk）。
# 壳工程 dashboard/android/ 是极简 WebView 工程（无 Capacitor）：
# - 前端产物 dist/ 由本流水线拷入 android/app/src/main/assets/；
# - 前端改动只需要重新部署服务器，不必出新包；壳改动才需要重跑本流水线。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '构建分支或提交号（留空用 4.29.0-customize）'
        required: false
        default: '4.29.0-customize'

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '4.29.0-customize' }}
          fetch-depth: 0

      - name: 安装 Java 21（安卓构建）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.2

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: 'pnpm'
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: 构建前端
        working-directory: dashboard
        run: pnpm run build

      - name: 前端产物拷入壳 assets
        working-directory: dashboard
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/
          ls android/app/src/main/assets | head

      - name: 固定调试签名（首次生成 keystore 并提交入库）
        working-directory: dashboard
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/app/debug.keystore
            git commit -m "build(android): 固定调试签名 keystore（升级可覆盖安装）"
            git push
            echo "固定签名 keystore 已提交入库"
          fi

      - name: 打包 APK
        working-directory: dashboard/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 归档 APK 到滚动 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          APK=dashboard/android/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" astrbot-webui-debug.apk
          cp "$APK" "astrbot-webui-${COMMIT}-debug.apk"
          gh release upload customize-build \
            astrbot-webui-debug.apk "astrbot-webui-${COMMIT}-debug.apk" \
            --clobber --repo "$GITHUB_REPOSITORY" || \
          gh release create customize-build \
            astrbot-webui-debug.apk "astrbot-webui-${COMMIT}-debug.apk" \
            --title "customize-build" \
            --notes "滚动构建产物（单交付包 + 指纹 + 安卓 APK）" \
            --repo "$GITHUB_REPOSITORY"
          echo "APK 归档完成"
