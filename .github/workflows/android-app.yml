name: Android App (Capacitor 打包)

# 独立流水线：只为安卓 APK 服务，不影响主构建。
# 产物发布到滚动 Release customize-build（astrbot-webui-debug.apk）。
# 说明：
# - 安卓壳工程源码在 dashboard/android/（进仓库）：
#   改 APP 名字、图标、原生功能，直接改壳工程源码文件，推送后出新包；
# - 首次运行自举两件事（都是自动提交，仅发生一次）：
#   a) Capacitor 依赖写进 dashboard/package.json 与 pnpm-lock.yaml；
#   b) 壳工程不存在时用 npx cap add android 生成并提交 dashboard/android/。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '构建分支或提交号（留空用 4.29.0-customize）'
        required: false
        default: '4.29.0-customize'

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '4.29.0-customize' }}
          fetch-depth: 0

      - name: 安装 Java 21（安卓构建，Capacitor 8 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.2

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: 'pnpm'
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: 依赖自举（首次运行把 Capacitor 写进 package.json 与 lockfile）
        working-directory: dashboard
        run: |
          if ! grep -q '@capacitor/core' pnpm-lock.yaml; then
            pnpm add -D @capacitor/core @capacitor/cli @capacitor/android
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json pnpm-lock.yaml
            git commit -m "build(android): 依赖自举 Capacitor（安卓流水线自动提交）"
            git push
          fi

      - name: 安装依赖
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: 构建前端
        working-directory: dashboard
        run: pnpm run build

      - name: 壳工程（存在即用仓库源码；首次生成并提交入库）
        working-directory: dashboard
        run: |
          BOOTSTRAPPED=0
          if [ ! -d android ]; then
            npx --yes cap add android
            BOOTSTRAPPED=1
          fi
          # 内网地址是 http 明文（REST 与 ws），必须允许明文流量
          grep -q usesCleartextTraffic android/app/src/main/AndroidManifest.xml || \
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' \
              android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic android/app/src/main/AndroidManifest.xml
          if [ "$BOOTSTRAPPED" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android
            git commit -m "build(android): 壳工程入库（Capacitor 自动生成，后续改名/图标/功能直接改这里）"
            git push
            echo "壳工程已提交入库"
          fi

      - name: 同步前端产物
        working-directory: dashboard
        run: npx --yes cap sync android

      - name: 打包 APK（64 位）
        working-directory: dashboard/android
        run: |
          # 只保留 64 位（arm64-v8a）
          grep -q "arm64-v8a" app/build.gradle || sed -i \
            's|defaultConfig {|defaultConfig {\n        ndk { abiFilters "arm64-v8a" }|' \
            app/build.gradle
          grep -q "arm64-v8a" app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 归档 APK 到滚动 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          APK=dashboard/android/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" astrbot-webui-debug.apk
          cp "$APK" "astrbot-webui-${COMMIT}-debug.apk"
          gh release upload customize-build \
            astrbot-webui-debug.apk "astrbot-webui-${COMMIT}-debug.apk" \
            --clobber --repo "$GITHUB_REPOSITORY" || \
          gh release create customize-build \
            astrbot-webui-debug.apk "astrbot-webui-${COMMIT}-debug.apk" \
            --title "customize-build" \
            --notes "滚动构建产物（单交付包 + 指纹 + 安卓 APK）" \
            --repo "$GITHUB_REPOSITORY"
          echo "APK 归档完成"
