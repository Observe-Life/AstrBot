apply plugin: 'com.android.application'

android {
    namespace = "com.observe.astrbot.webui"
    compileSdk = 36
    defaultConfig {
        applicationId "com.observe.astrbot.webui"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 4
        versionName "2.2"
        ndk { abiFilters "arm64-v8a" }
    }
    signingConfigs {
        // 固定调试签名：keystore 进仓库，云端与本地一致，升级可直接覆盖安装。
        fixedDebug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.fixedDebug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$rootProject.ext.androidxAppCompatVersion"
    implementation "androidx.core:core:$rootProject.ext.androidxCoreVersion"
    implementation "androidx.webkit:webkit:$rootProject.ext.androidxWebkitVersion"
    implementation "androidx.activity:activity:$rootProject.ext.androidxActivityVersion"
}
